name: Publicar Sea Power Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sea-power-atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener los archivos
        uses: actions/checkout@v4
      - name: Validar JavaScript y guía táctica
        run: |
          node --check app.js
          node --check planner.js
          node --check source.js
          node --check mod_source.js
          node --check campaign.js
          node --check armory.js
          node --check operations.js
          node --check catalog.js
          node --check image_pack.js
          node -e "const x=require('./verified_images.json');const d=require('./data.json');const u=d.entries.filter(e=>['aircraft','ship'].includes(e.category));const w=d.entries.filter(e=>e.category==='weapon');if(u.length!==16||w.length!==20||[...u,...w].some(e=>!x.items[e.id]))process.exit(1);console.log('16 unidades y 20 armas con imágenes: OK')"
          node image_pack.test.cjs
          node tools/catalog_image_coverage.cjs --check
          node -e "const d=require('./catalogo_completo_1985.json');if(d.units.length!==636||d.weapons.length!==471)process.exit(1);console.log('636 unidades y 471 armas: OK')"
          node runtime.smoke.cjs
          node planner.test.cjs
          node --check tactics.js
          node --check workshop.js
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('workshop-mods.json','utf8'));if(d.mods.length!==21||new Set(d.mods.map(x=>x.id)).size!==21)process.exit(1);console.log('21 mods sin duplicados: OK')"
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('data.json','utf8')); const guide=JSON.parse(fs.readFileSync('tactics.json','utf8')); if(!Array.isArray(data.entries)||!Array.isArray(guide.scenarios)||guide.scenarios.length<13)process.exit(1); console.log('Datos y 13+ situaciones: OK')"
      - name: Comprobar Copiloto y Catálogo unificado en Chrome real
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "Chrome no disponible en el runner"; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for route in ops armory library; do
            echo "Probando ruta $route en Chrome"
            if ! html="$(timeout --signal=TERM --kill-after=5s 30s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-features=ServiceWorker --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8765/?v=3.7.0#/$route" 2>/tmp/atlas-chrome.log)"; then
              echo "Chrome no pudo abrir $route en el plazo de diagnóstico."
              tail -c 1800 /tmp/atlas-chrome.log
              exit 1
            fi
            case "$route" in ops) expected='class="ops-page"';; armory|library) expected='class="catalog-page"';; esac
            if ! grep -Fq "$expected" <<< "$html"; then
              echo "Error al abrir $route en Chrome; salida del navegador:"
              echo "$html" | tail -c 2200
              tail -c 1500 /tmp/atlas-chrome.log
              exit 1
            fi
            echo "OK: $route abre en Chrome real"
          done
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Esperar registro del artefacto
        run: sleep 10
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
