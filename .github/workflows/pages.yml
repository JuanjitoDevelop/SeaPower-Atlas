name: Publicar Sea Power Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sea-power-atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener los archivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Esperar registro del artefacto
        run: sleep 10
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
